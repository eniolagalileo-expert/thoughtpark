<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThoughtPark</title>
  <meta name="description" content="A bedtime brain dump that parks your racing thoughts for the night and hands them back in the morning.">
  <meta name="theme-color" content="#0e1424">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f2cf7a' d='M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="night">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
      </svg>
      <span>ThoughtPark</span>
    </div>
    <div class="mode-toggle" id="mode-toggle" role="group" aria-label="Show night or morning">
      <button type="button" data-mode="night" aria-pressed="true">Night</button>
      <button type="button" data-mode="morning" aria-pressed="false">Morning</button>
    </div>
  </header>

  <main id="screen" class="screen"></main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
